<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="Bootsrap/css/bootstrap.min.css">
    <script src="Bootsrap/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="m-4 ">
        <form action="">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required>

            </div>
            
            
            <div  class="mb-3">
                <label for="email" class="form-label">Enter your Email</label>
                <input type="email" id="email" class="form-control" placeholder="name@gmail.com" required>

            </div>
            
            
            <div class="mb-3">
                <label for="phone" class="form-label">Enter Phone No.</label>
                <input type="tel" class="form-control" id="phone" required>

            </div>
            <div class="mb-3">
                <label for="D.O.B" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" required id="D.O.B">
            </div>
            <div class="mb-3">
                <label for="quiz" class="form-label">What is your Primary Commuication Language?</label>
                <select name="quiz" id="quiz" class="form-select">
                    <option value="French">French</option>
                    <option value="English">English</option>
                    <option value="Kiswahili">Kiswahili</option>


                </select>
            </div>    
            <div class="mb-3">
                <label for="language" class=" form-label ">What is your Strong programming language?</label><br>
                <input type="radio" id="language" class="form-check-input" name="programming" value="Python">Python <br>
                <input type="radio" id="language" class="form-check-input" name="programming" value="Java">Java <br>
                <input type="radio" id="language" name="programming" value="Kotlin" class="form-check-input">Kotlin

            </div>
            <div class="mb-3">
                <label for="framework" class="form-label">Which  is an enterprise Backend framework</label><br>
                <input type="checkbox" id="framework" name="f.wrk" class="form-check-input" value="Java SpringBoot" required>Java Springboot <br>
                <input type="checkbox" id="framework" class="form-check-input" name="f.wrk" value=" python Django" required>python Django <br>
                <input type="checkbox" id="framework" class="form-check-input" name="f.wrk" value="Laravel" required>Laravel <br>
                <input type="checkbox" id="framework" class="form-check-input" name="f.wrk" value="Mern stack" required>Mern stack
            </div>
            <div>
                <label for="experience" class="form-label">Tell us about your experience in Tech</label>
                <textarea name="tech_exp" id="experience" rows="4" cols="50" class="form-control" required></textarea>

            </div>

            </div>
            











        </form>














    </div>
    
    
    
    
    
    
    
    
    
    
    
    






    
</body>
</html>
